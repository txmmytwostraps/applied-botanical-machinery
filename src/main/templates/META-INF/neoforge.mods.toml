modLoader = "javafml"
loaderVersion = "[1,)"
license = "LGPL-3.0"

[[mods]]
modId = "${mod_id}"
version = "${mod_version}"
displayName = "Applied Botanical Machinery"
description = '''
Unofficial port of Applied Botanics, Botanical Machinery and Botanical Machinery Extra Reforked to Botania Revived, in one mod.
Mana through AE2, and machines that automate Botania.
'''
logoFile = "logo.png"
authors = "ramidzkh (Applied Botanics), MelanX and noeppi_noeppi (Botanical Machinery), BOLT_M4G1C (Botanical Machinery Extra Reforked), LMor and nexxx_7 (Botanical Machinery Extra), txmmytwostraps (port)"
credits = "Unofficial port. Not affiliated with or supported by the original authors."

[[mixins]]
config = "appliedbotanicalmachinery.mixins.json"

[[dependencies.${mod_id}]]
modId = "neoforge"
type = "required"
versionRange = "[${neo_version},)"
ordering = "NONE"
side = "BOTH"

[[dependencies.${mod_id}]]
modId = "minecraft"
type = "required"
versionRange = "[${minecraft_version}]"
ordering = "NONE"
side = "BOTH"

[[dependencies.${mod_id}]]
modId = "ae2"
type = "required"
versionRange = "[${ae2_version},)"
ordering = "AFTER"
side = "BOTH"

[[dependencies.${mod_id}]]
modId = "botania"
type = "required"
versionRange = "[1.0.3,2)"
ordering = "AFTER"
side = "BOTH"

[[dependencies.${mod_id}]]
modId = "libx"
type = "required"
versionRange = "[${libx_version},)"
ordering = "NONE"
side = "BOTH"

[[dependencies.${mod_id}]]
modId = "masterfulbotany"
type = "optional"
versionRange = "[1.0.0,)"
ordering = "AFTER"
side = "BOTH"
