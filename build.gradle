plugins {
    id "java-library"
    id "net.neoforged.moddev" version "2.0.148"
    id "idea"
    id "com.diffplug.spotless" version "8.7.0"
}

group = "io.github.txmmytwostraps"
version = "${minecraft_version}-${mod_version}"

base {
    archivesName = mod_id
}

// Minecraft 26.1 requires Java 25
java.toolchain.languageVersion = JavaLanguageVersion.of(25)

neoForge {
    // Specify the version of NeoForge to use.
    version = project.neo_version

    // Default run configurations.
    // These can be tweaked, removed, or duplicated as needed.
    runs {
        client {
            client()

            // 26.1.2 runs keep their own folders, apart from the 1.21.1 line's worlds
            gameDirectory = project.file("run26")
        }

        server {
            server()
            programArgument "--nogui"

            // Separate from the client's run directory so both can run at once
            gameDirectory = project.file("run26-server")
        }

        // One clientData run with --all generates both the client (assets) and server (data) providers
        data {
            clientData()

            // Specify the modid for data generation, where to output the resulting resource, and where to look for existing resources.
            programArguments.addAll "--mod", project.mod_id, "--all", "--output", file("src/generated/resources/").getAbsolutePath(), "--existing", file("src/main/resources/").getAbsolutePath()

            // Data runs get their own game directory so the mods in dataMods load only here
            gameDirectory = project.file("run26-data")
        }

        // applies to all the run configs above
        configureEach {
            // Recommended logging data for a userdev environment
            // The markers can be added/remove as needed separated by commas.
            // "SCAN": For mods scan.
            // "REGISTRIES": For firing of registry events.
            // "REGISTRYDUMP": For getting the contents of all registries.
            systemProperty "forge.logging.markers", "REGISTRIES"

            // Recommended logging level for the console
            // You can set various levels here.
            // Please read: https://stackoverflow.com/questions/2031163/when-to-use-the-different-log-levels
            logLevel = org.slf4j.event.Level.DEBUG
        }
    }

    mods {
        // define mod <-> source bindings
        // these are used to tell the game which sources are for which mod
        // multi mod projects should define one per mod
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }
}

repositories {
    maven {
        url = "https://maven.blamejared.com"
    }

    exclusiveContent {
        forRepository {
            maven {
                url = "https://maven.moddingx.org/release"
            }
        }

        filter {
            includeGroup "org.moddingx"
        }
    }

    exclusiveContent {
        forRepository {
            maven {
                url = "https://maven.theillusivec4.top/"
            }
        }

        filter {
            includeGroup "top.theillusivec4.curios"
        }
    }

    exclusiveContent {
        forRepository {
            maven {
                url = "https://maven.terraformersmc.com/"
            }
        }

        filter {
            includeGroup "dev.emi"
        }
    }

    exclusiveContent {
        forRepository {
            maven {
                url = "https://cursemaven.com/"
            }
        }

        filter {
            includeGroup "curse.maven"
        }
    }

    exclusiveContent {
        forRepository {
            maven {
                url = "https://api.modrinth.com/maven"
            }
        }

        filter {
            includeGroup "maven.modrinth"
        }
    }
}

configurations {
    dataMods
}

dependencies {
    annotationProcessor("org.moddingx:LibX:${libx_version}")
    implementation("org.moddingx:LibX:${libx_version}")
    implementation("org.appliedenergistics:appliedenergistics2:${ae2_version}")

    // Botania Revived, Masterful Botany and Extra Botany Revived for 26.1.2 (CurseForge files)
    implementation("curse.maven:botania-revived-1725641:${botania_revived_id}")
    compileOnly("curse.maven:masterful-botany-1764701:${masterfulbotany_id}")
    // dev: -Pwithout_masterfulbotany leaves it out of the runs (its 26.1.2 build does not start on a dedicated server)
    if (!project.hasProperty("without_masterfulbotany")) {
        runtimeOnly("curse.maven:masterful-botany-1764701:${masterfulbotany_id}")
    }

    // dev: Extra Botany Revived, so the test instance runs with it
    runtimeOnly("curse.maven:extra-botany-revived-1764698:${extrabotany_id}")
    runtimeOnly("vazkii.patchouli:patchouli-neoforge:${patchouli_version}")
    runtimeOnly("top.theillusivec4.curios:curios-neoforge:${curios_version}")

    compileOnly("mezz.jei:jei-${project.minecraft_version}-neoforge-api:${project.jei_version}")
    // EMI has no 26.1.2 release yet: its plugins are left out of the build (see sourceSets below)

    // dev: choose dev runtime xei mod(s)
    def xei = ["jei"]

    if (xei.remove("jei")) {
        runtimeOnly("mezz.jei:jei-${project.minecraft_version}-neoforge:${project.jei_version}")
    }

    if (!xei.isEmpty()) {
        throw new GradleException("Unknown xei mods: $xei")
    }

    runtimeOnly("maven.modrinth:jade:${jade_version}")
    runtimeOnly("org.appliedenergistics:guideme:${guideme_version}")

    // MEGA Cells has no 26.1.2 release yet. Our side (the appbot mod id and appbot.* classes) needs nothing from it.

    // Botania Revived's GatherDataEvent listener loads Curios classes unconditionally
    dataMods("top.theillusivec4.curios:curios-neoforge:${curios_version}") {
        transitive = false
    }
}

var syncDataMods = tasks.register("syncDataMods", Sync) {
    from configurations.dataMods
    into "run26-data/mods"
}
tasks.matching { it.name == "runData" }.configureEach { dependsOn syncDataMods }

// Lets the dev server read console commands such as "stop"
tasks.matching { it.name == "runServer" }.configureEach { standardInput = System.in }

// EMI has no 26.1.2 release yet
sourceSets.main.java {
    exclude "appliedbotanicalmachinery/integration/emi/**"
    exclude "appliedbotanicalmachinery/machinery/compat/BotanicalEMIPlugin.java"
    exclude "appliedbotanicalmachinery/extramachinery/compat/emi.java"
}

// Include resources generated by data generators, without their cache.
sourceSets.main.resources {
    srcDir "src/generated/resources"
    exclude ".cache"
}

// This block of code expands all declared replace properties in the specified resource targets.
// A missing property will result in an error. Properties are expanded using ${} Groovy notation.
var generateModMetadata = tasks.register("generateModMetadata", ProcessResources) {
    var replaceProperties = [
            neo_version            : neo_version,
            minecraft_version      : minecraft_version,
            mod_id                 : mod_id,
            mod_version            : project.version,
            ae2_version            : ae2_version,
            libx_version           : libx_version,
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from "src/main/templates"
    into "build/generated/sources/modMetadata"
}
// Include the output of "generateModMetadata" as an input directory for the build
// this works with both building through Gradle and the IDE.
sourceSets.main.resources.srcDir generateModMetadata
// To avoid having to run "generateModMetadata" manually, make it run on every project reload
neoForge.ideSyncTask generateModMetadata

tasks.withType(JavaCompile).configureEach {
    options.encoding = "UTF-8" // Use the UTF-8 charset for Java compilation
}

// IDEA no longer automatically downloads sources/javadoc jars for dependencies, so we need to explicitly enable the behavior.
idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}

/////////////
// Spotless
spotless {
    java {
        // The machinery packages keep their authors' own formatting
        target("src/main/java/**/*.java")
        targetExclude("src/main/java/appliedbotanicalmachinery/machinery/**", "src/main/java/appliedbotanicalmachinery/extramachinery/**")

        endWithNewline()
        leadingTabsToSpaces()
        removeUnusedImports()
        toggleOffOn()
        eclipse().configFile(file("codeformat/codeformat.xml"))
        importOrderFile(file("codeformat/ae2.importorder"))
    }

    format("json") {
        target("src/main/resources/**/*.json")
        prettier().config(parser: "json")
    }
}

// The licenses and notices of the combined works ship with the jar
tasks.named("jar", Jar) {
    from("LICENSE", "NOTICE")
    from("licenses") {
        into "licenses"
    }
}
